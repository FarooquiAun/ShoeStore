version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: shoestore-db
    environment:
      POSTGRES_DB: shoestore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shoestore-network

  springboot-app:
    build: .
    container_name: shoestore-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    networks:
      - shoestore-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: shoestore-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shoestore.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - shoestore-network

volumes:
  postgres_data:

networks:
  shoestore-network:
